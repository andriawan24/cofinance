name: CD - Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'New internal build'

concurrency:
  group: cd-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build & Distribute Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          google_auth_client_id=${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          storage.base_url=${{ secrets.STORAGE_BASE_URL }}
          storage.access_key=${{ secrets.STORAGE_ACCESS_KEY }}
          storage.access_secret=${{ secrets.STORAGE_ACCESS_SECRET }}
          storage.bucket_name=${{ secrets.STORAGE_BUCKET_NAME }}
          storage.region=${{ secrets.STORAGE_REGION }}
          sdk.dir=$ANDROID_HOME
          EOF

      - name: Provision Android Firebase configuration
        id: android_firebase
        shell: bash
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
          FIREBASE_ANDROID_PACKAGE_NAME: id.andriawan.cofinance
          FIREBASE_ANDROID_CONFIG_PATH: androidApp/google-services.json
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_ANDROID_CONFIG_BASE64:-}" ]; then
            echo "::error::FIREBASE_ANDROID_CONFIG_BASE64 is not configured."
            exit 1
          fi

          ruby -rbase64 -rjson -e '
            begin
              encoded = ENV.fetch("FIREBASE_ANDROID_CONFIG_BASE64").delete("\r\n")
              decoded = Base64.strict_decode64(encoded)
              config = JSON.parse(decoded)
              package_name = ENV.fetch("FIREBASE_ANDROID_PACKAGE_NAME")
              matching_client = config.fetch("client").any? do |client|
                client.dig("client_info", "android_client_info", "package_name") == package_name
              end
              raise "package mismatch" unless matching_client
              File.binwrite(ENV.fetch("FIREBASE_ANDROID_CONFIG_PATH"), decoded)
            rescue StandardError
              warn "Android Firebase configuration is invalid or does not match the application package."
              exit 1
            end
          '

          firebase_project_id="$(
            ruby -rjson -e '
              config = JSON.parse(File.read(ENV.fetch("FIREBASE_ANDROID_CONFIG_PATH")))
              print config.dig("project_info", "project_id").to_s
            '
          )"

          if [ -z "$firebase_project_id" ]; then
            echo "::error::Android Firebase configuration does not contain a project ID."
            exit 1
          fi

          echo "project_id=$firebase_project_id" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

      - name: Validate Firebase App Distribution credentials
        id: firebase_distribution
        shell: bash
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_JSON }}
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_APP_ID_ANDROID:-}" ]; then
            echo "::error::FIREBASE_APP_ID_ANDROID is not configured."
            exit 1
          fi

          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}" ]; then
            echo "::error::GOOGLE_SERVICE_JSON is not configured."
            exit 1
          fi

          firebase_service_account_json=""

          if firebase_service_account_json="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode 2>/dev/null)"; then
            :
          elif firebase_service_account_json="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON_BASE64" | base64 -D 2>/dev/null)"; then
            :
          else
            echo "::error::GOOGLE_SERVICE_JSON is not valid base64."
            exit 1
          fi

          firebase_service_account_type="$(
            FIREBASE_SERVICE_ACCOUNT_JSON="$firebase_service_account_json" \
            ruby -rjson -e 'print(JSON.parse(ENV.fetch("FIREBASE_SERVICE_ACCOUNT_JSON")).fetch("type", ""))' 2>/dev/null || true
          )"

          if [ "$firebase_service_account_type" != "service_account" ]; then
            echo "::error::GOOGLE_SERVICE_JSON is not a service account credential."
            exit 1
          fi

          firebase_service_account_path="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$firebase_service_account_json" > "$firebase_service_account_path"

          echo "service_account_path=$firebase_service_account_path" >> "$GITHUB_OUTPUT"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Ensure Firebase tester group exists
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase_distribution.outputs.service_account_path }}
          FIREBASE_PROJECT_ID: ${{ steps.android_firebase.outputs.project_id }}
        run: |
          set -euo pipefail

          groups_json="$RUNNER_TEMP/firebase-app-distribution-groups.json"
          firebase appdistribution:groups:list \
            --project "$FIREBASE_PROJECT_ID" \
            --json > "$groups_json"

          if ! GROUPS_JSON_PATH="$groups_json" ruby -rjson -e '
            payload = JSON.parse(File.read(ENV.fetch("GROUPS_JSON_PATH")))
            groups = payload.dig("result", "groups") || payload["groups"] || []
            exit(groups.any? { |group| group["name"].to_s.end_with?("/groups/internal-testers") } ? 0 : 1)
          '; then
            firebase appdistribution:groups:create \
              "Internal Testers" \
              internal-testers \
              --project "$FIREBASE_PROJECT_ID"
          fi

      - name: Distribute release through Firebase
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.firebase_distribution.outputs.service_account_path }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          RELEASE_NOTES: >-
            ${{ github.event.inputs.release_notes ||
                format('Build #{0} from {1}', github.run_number, github.ref_name) }}
        run: |
          set -euo pipefail

          firebase appdistribution:distribute \
            androidApp/build/outputs/apk/release/androidApp-release.apk \
            --app "$FIREBASE_APP_ID_ANDROID" \
            --groups internal-testers \
            --release-notes "$RELEASE_NOTES

          Commit: $GITHUB_SHA"
